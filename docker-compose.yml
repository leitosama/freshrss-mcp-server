services:
  freshrss-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      # For dynamic (JS-rendered) fetch, build the Playwright variant instead:
      #   dockerfile: Dockerfile.playwright
    ports:
      - "8080:8080"
    environment:
      - FRESHRSS_API_URL=${FRESHRSS_API_URL}
      - FRESHRSS_USERNAME=${FRESHRSS_USERNAME}
      - FRESHRSS_API_PASSWORD=${FRESHRSS_API_PASSWORD}
      - MCP_TRANSPORT=streamable-http
      - ENABLE_DYNAMIC_FETCH=${ENABLE_DYNAMIC_FETCH:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
