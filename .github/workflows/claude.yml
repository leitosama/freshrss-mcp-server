name: Claude

# On-demand Claude for anything Dependabot can't handle alone: coordinated
# multi-file bumps (e.g. the Python version), diagnosing a red CI run on a
# dependency PR, or judging a major-version bump. See CLAUDE.md's
# "Dependency Maintenance" section for example prompts.
#
# Deliberately comment/mention-triggered rather than running automatically
# on every Dependabot PR: the actor here is whoever writes the @claude
# comment (or assigns the issue), never dependabot[bot] itself, so Actions
# secrets and a writable GITHUB_TOKEN are available with none of the
# read-only-token restrictions that apply to Dependabot-triggered
# `pull_request` runs. The action itself checks for the @claude trigger
# phrase (or assignment) internally, so no extra `if:` gating is needed
# here.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions: {}

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Run Claude
        uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33 # v1.0.261
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
