name: Validate Playwright image (build only)

# Keeps the optional Dockerfile.playwright variant from rotting. This image
# is intentionally NOT published anywhere: build it yourself with
#   docker build -f Dockerfile.playwright -t freshrss-mcp:playwright .

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.playwright
      - pyproject.toml
      - uv.lock
      - src/**
      - .github/workflows/docker-playwright.yml
  pull_request:
    branches: [main]
    paths:
      - Dockerfile.playwright
      - pyproject.toml
      - uv.lock
      - src/**
      - .github/workflows/docker-playwright.yml
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.playwright
          platforms: linux/amd64
          load: true
          tags: freshrss-mcp:playwright-ci
          push: false
          cache-from: type=gha,scope=playwright
          cache-to: type=gha,mode=max,scope=playwright,ignore-error=true

      - name: Smoke test
        run: |
          docker run --rm \
            -e FRESHRSS_API_URL=http://example.invalid/api/greader.php \
            -e FRESHRSS_USERNAME=ci -e FRESHRSS_API_PASSWORD=ci \
            freshrss-mcp:playwright-ci freshrss-mcp --version
          docker run --rm freshrss-mcp:playwright-ci playwright --version
