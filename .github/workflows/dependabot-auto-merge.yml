name: Dependabot auto-merge

# Auto-merges Dependabot PRs for patch/minor bumps once CI is green; major
# bumps are always left for manual (or @claude) review. See CLAUDE.md's
# "Dependency Maintenance" section for the full rationale.
#
# Runs as pull_request_target rather than pull_request: a Dependabot-
# triggered `pull_request` run gets a read-only GITHUB_TOKEN, so `gh pr
# merge` would fail. This is safe here specifically because no PR code is
# ever checked out or executed — fetch-metadata and `gh pr merge` are pure
# GitHub API calls. Do not add a checkout step to this workflow.

on: pull_request_target # zizmor: ignore[dangerous-triggers]

permissions: {}

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for patch/minor bumps
        if: |
          contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'), steps.metadata.outputs.update-type)
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"
